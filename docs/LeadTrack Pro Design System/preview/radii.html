<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-sans); }
.row { display: flex; gap: 14px; align-items: flex-end; }
.r { width: 72px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.box { width: 64px; height: 64px; background: var(--violet-500); }
.n { font-family: var(--font-mono); font-size: 10px; color: var(--fg); font-weight: 600; }
.v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 12px; font-weight: 600; }
</style></head>
<body>
<h3>Corner radii</h3>
<div class="row">
  <div class="r"><div class="box" style="border-radius:4px"></div><div class="n">xs</div><div class="v">4px</div></div>
  <div class="r"><div class="box" style="border-radius:6px"></div><div class="n">sm</div><div class="v">6px</div></div>
  <div class="r"><div class="box" style="border-radius:10px"></div><div class="n">md</div><div class="v">10px</div></div>
  <div class="r"><div class="box" style="border-radius:14px"></div><div class="n">lg</div><div class="v">14px</div></div>
  <div class="r"><div class="box" style="border-radius:20px"></div><div class="n">xl</div><div class="v">20px</div></div>
  <div class="r"><div class="box" style="border-radius:28px"></div><div class="n">2xl</div><div class="v">28px</div></div>
  <div class="r"><div class="box" style="border-radius:9999px"></div><div class="n">full</div><div class="v">pill</div></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--bg); }
.label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-subtle); font-weight: 600; margin-bottom: 8px; font-family: var(--font-sans); }
.row + .row { margin-top: 20px; }
.d { font-family: var(--font-sans); font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: var(--fg); }
.d em { font-family: var(--font-serif); font-weight: 400; font-style: italic; color: var(--violet-600); }
.meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-top: 6px; }
</style></head>
<body>
<div class="row">
  <div class="label">Display — hero</div>
  <div class="d">Pipeline de <em>vendas</em></div>
  <div class="meta">Geist 64/700/-0.03em · Instrument Serif italic 400</div>
</div>
</body></html>

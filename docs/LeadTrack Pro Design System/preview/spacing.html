<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-sans); }
.row { display: grid; grid-template-columns: 80px 60px 1fr; gap: 14px; align-items: center; padding: 6px 0; }
.token { font-family: var(--font-mono); font-size: 11px; color: var(--fg); font-weight: 600; }
.val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
.bar { height: 10px; background: var(--violet-500); border-radius: 2px; }
h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 10px; font-weight: 600; }
</style></head>
<body>
<h3>Spacing — 4px grid</h3>
<div class="row"><div class="token">--space-1</div><div class="val">4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><div class="token">--space-2</div><div class="val">8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><div class="token">--space-3</div><div class="val">12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><div class="token">--space-4</div><div class="val">16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><div class="token">--space-6</div><div class="val">24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><div class="token">--space-8</div><div class="val">32px</div><div class="bar" style="width:32px"></div></div>
<div class="row"><div class="token">--space-12</div><div class="val">48px</div><div class="bar" style="width:48px"></div></div>
<div class="row"><div class="token">--space-16</div><div class="val">64px</div><div class="bar" style="width:64px"></div></div>
<div class="row"><div class="token">--space-20</div><div class="val">80px</div><div class="bar" style="width:80px"></div></div>
</body></html>

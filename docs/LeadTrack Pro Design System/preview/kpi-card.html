<!doctype html>
<html><head><meta charset="utf-8"><title>KPI Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { margin: 0; padding: 22px; background: var(--bg); font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.kpi { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); font-weight: 600; }
.value { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; color: var(--fg); line-height: 1.1; font-variant-numeric: tabular-nums; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--success-500); font-family: var(--font-mono); }
.delta.down { color: var(--danger-500); }
.delta [data-lucide] { width: 12px; height: 12px; }
.sub { font-size: 12px; color: var(--fg-muted); }
</style></head>
<body>
<div class="kpi">
  <div class="label">Leads ativos</div>
  <div class="value">1.248</div>
  <div class="delta"><i data-lucide="trending-up"></i>+12.4% <span style="color:var(--fg-muted); font-family: inherit;">vs mês anterior</span></div>
</div>
<div class="kpi">
  <div class="label">Taxa de conversão</div>
  <div class="value">18,2%</div>
  <div class="delta"><i data-lucide="trending-up"></i>+2.1pp</div>
</div>
<div class="kpi">
  <div class="label">Receita em pipeline</div>
  <div class="value">R$ 482k</div>
  <div class="delta down"><i data-lucide="trending-down"></i>−3.8%</div>
</div>
<script>lucide.createIcons();</script>
</body></html>

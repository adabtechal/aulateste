<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 32px; background: var(--bg); font-family: var(--font-sans); }
.row { display: flex; gap: 28px; }
.card { background: var(--bg-panel); width: 110px; height: 70px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); font-weight: 600; }
.s-xs { box-shadow: 0 1px 2px rgba(20, 23, 31, 0.04); }
.s-sm { box-shadow: 0 1px 3px rgba(20, 23, 31, 0.06), 0 1px 2px rgba(20, 23, 31, 0.04); }
.s-md { box-shadow: 0 4px 12px rgba(20, 23, 31, 0.06), 0 2px 4px rgba(20, 23, 31, 0.04); }
.s-lg { box-shadow: 0 12px 32px rgba(20, 23, 31, 0.08), 0 4px 8px rgba(20, 23, 31, 0.04); }
.s-xl { box-shadow: 0 24px 48px rgba(20, 23, 31, 0.12), 0 8px 16px rgba(20, 23, 31, 0.05); }
.s-violet { box-shadow: 0 8px 24px rgba(109, 67, 245, 0.30); background: var(--violet-500); color: white; }
h3 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 18px; font-weight: 600; }
</style></head>
<body>
<h3>Elevation</h3>
<div class="row">
  <div class="card s-xs">xs</div>
  <div class="card s-sm">sm</div>
  <div class="card s-md">md</div>
  <div class="card s-lg">lg</div>
  <div class="card s-xl">xl</div>
  <div class="card s-violet">violet</div>
</div>
</body></html>

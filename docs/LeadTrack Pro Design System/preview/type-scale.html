<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 20px 24px; background: var(--bg); font-family: var(--font-sans); color: var(--fg); }
.row { display: grid; grid-template-columns: 110px 1fr; align-items: baseline; gap: 24px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
.row:last-child { border: none; }
.t { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); text-transform: uppercase; letter-spacing: 0.08em; }
h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.015em; margin: 0; line-height: 1.15; }
h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.25; }
h3 { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.3; }
h4 { font-size: 20px; font-weight: 600; margin: 0; line-height: 1.35; }
.body { font-size: 14px; font-weight: 400; line-height: 1.55; }
.small { font-size: 13px; color: var(--fg-muted); }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-subtle); }
</style></head>
<body>
<div class="row"><div class="t">H1 38</div><h1>Central de leads</h1></div>
<div class="row"><div class="t">H2 30</div><h2>Pipeline de vendas</h2></div>
<div class="row"><div class="t">H3 24</div><h3>Configuração de WhatsApp</h3></div>
<div class="row"><div class="t">H4 20</div><h4>Follow-up automático</h4></div>
<div class="row"><div class="t">Body 14</div><div class="body">Gerencie seus leads com inteligência. Cada contato automaticamente enriquecido.</div></div>
<div class="row"><div class="t">Small 13</div><div class="small">há 3 horas · Qualificado · R$ 12.400</div></div>
<div class="row"><div class="t">Label 11</div><div class="label">Último contato</div></div>
</body></html>
